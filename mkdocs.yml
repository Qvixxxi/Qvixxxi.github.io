site_name: "Qvi' Web"
site_description: "Qvi 的个人博客，记录开发、部署与日常折腾。"
site_url: https://qvixxxi.github.io/
repo_url: https://github.com/Qvixxxi/Qvixxxi.github.io # 右上角点击跳转的链接
repo_name: Qvixxxi # 右上角的名字

theme:
  name: material #主题名字
  custom_dir: docs/overrides
  language: zh  #站点语言

  features:
    - navigation.top                          # 返回顶部的按钮
    - navigation.sections                     # 不折叠导航栏
    - navigation.expand                       # 自动打开折叠的子部分
    - navigation.path                         # 显示导航路径
    - search.suggest                          # 搜索建议
    - search.highlight                        # 搜索结果高亮
    - search.share                            # 搜索共享
    - navigation.indexes  
    - content.code.copy                       #代码复制按钮
    - toc.follow                              # 目录跟随阅读位置
  palette:
   #更改主题颜色需要下面两个模式都要改
    - scheme: default
      primary: teal  # 主题主色调
      toggle:
        icon: material/brightness-7
        name: 切换至夜间模式

    - scheme: slate
      primary: teal  # 主题主色调
      toggle:
        icon: material/brightness-4
        name: 切换至日间模式
  font: false
  icon:
     repo: fontawesome/brands/github #右上角图标
     logo: image2
  #edit_uri: edit/main/docs # 编辑按钮跳转的链接
  
nav:
  - Home: index.md
  - Test: test.md
  - Share: 
    - 好物分享: share/share.md
    - 沉浸式翻译: share/Translate.md
    - Docker: share/Docker.md
    - Mkdocs: share/Mkdocs.md
  - Blog:
    - blog/index.md
  - Links:  links.md
  - About: about/about.md
  - Travelling: https://www.travellings.cn/go.html
  # - Getting Started: getting-started.md
  # - Installation: installation.md
  # - Setup: setup.md
  # - Configuration: setup/configuration.md
  # - Navigation: setup/navigation.md
  # - Plugins: plugins.md
  # - Reference: reference.md
  # - Community: community.md
  # - Blog: blog.md
    



